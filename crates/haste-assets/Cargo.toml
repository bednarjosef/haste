[package]
name = "haste-assets"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Textures, block/item models, blockstate definitions, fonts and GUI sprites read from the player's client jar and the assets index. Owner: renderer."

[dependencies]
haste-core.workspace = true
haste-data.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
image.workspace = true
thiserror.workspace = true
anyhow.workspace = true
ahash.workspace = true
tracing.workspace = true
# insertion-ordered map: blockstate `variants` iterates in the file's order,
# which decides the winner when several keys match a state equally well
indexmap = { version = "2.14.2", features = ["serde"] }
