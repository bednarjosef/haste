# Proxy set for spike 2 ("pure" mode: hot getters are Rust natives). build-java.sh derives the
# "mirror" variant by turning the two hot getters into field getters.
class net/minecraft/client/Minecraft
class net/minecraft/client/player/LocalPlayer
class net/minecraft/world/entity/player/Inventory
class net/minecraft/world/item/ItemStack
class net/minecraft/client/gui/screens/Screen
class net/minecraft/client/gui/GuiGraphicsExtractor
class net/minecraft/client/input/KeyEvent
native net/minecraft/world/entity/Entity#getX()D
native net/minecraft/world/entity/player/Player#getInventory()Lnet/minecraft/world/entity/player/Inventory;
native net/minecraft/world/entity/player/Inventory#getItem(I)Lnet/minecraft/world/item/ItemStack;
native net/minecraft/world/item/ItemStack#getCount()I
native net/minecraft/world/item/ItemStack#setCount(I)V
getter net/minecraft/client/input/KeyEvent#key()I=key
delegate net/minecraft/client/gui/GuiGraphicsExtractor#fill(IIIII)V=haste/rt/GuiBatch#fill
delegate net/minecraft/client/gui/GuiGraphicsExtractor#text(Lnet/minecraft/client/gui/Font;Ljava/lang/String;III)V=haste/rt/GuiBatch#text
mixin haste/testmod/mixin/LocalPlayerMixin
