# Tier-2 proxy set (syntax: java/haste/proxy/Gen.java). Generated at startup into cache/proxies/26.3/ (never
# committed). Methods without impl/noop/getter are logging stubs: haste.rt.Unimplemented is the to-do list.
# Every implemented method is listed with its reason in NOTES.md.

class net/minecraft/client/Minecraft
impl  net/minecraft/client/Minecraft haste/gui/ClientImpl

class net/minecraft/client/gui/Gui
impl  net/minecraft/client/gui/Gui haste/gui/ClientImpl

class com/mojang/blaze3d/platform/Window
impl  com/mojang/blaze3d/platform/Window haste/gui/ClientImpl

class net/minecraft/client/gui/Font
impl  net/minecraft/client/gui/Font haste/gui/FontImpl

class net/minecraft/client/gui/GuiGraphicsExtractor
impl  net/minecraft/client/gui/GuiGraphicsExtractor haste/gui/GfxImpl



# no sound in Haste yet: every method returns 0/null
class net/minecraft/client/sounds/SoundManager
noop  net/minecraft/client/sounds/SoundManager#*

# tier-1 game objects. Their static state (codecs, resource keys, synched-data accessors, attribute
# constants) is vanilla's: `statics` keeps <clinit> and static method bodies; instances are Rust's.
class net/minecraft/client/player/LocalPlayer
statics net/minecraft/world/entity/Entity
statics net/minecraft/world/entity/LivingEntity
statics net/minecraft/world/entity/Avatar
statics net/minecraft/world/entity/player/Player
statics net/minecraft/client/player/AbstractClientPlayer
statics net/minecraft/client/player/LocalPlayer
# Their methods keep vanilla's bodies (`keepall`): they run over the proxy's real vanilla parts (synched entity
# data from the forwarded packets, attributes, effects, inventory, abilities, food data) and over the Rust state
# the impls in PlayerImpl/LevelImpl provide (health, game mode, position, ...), which win over the kept bodies.
keepall net/minecraft/world/entity/Entity
keepall net/minecraft/world/entity/LivingEntity
keepall net/minecraft/world/entity/Avatar
keepall net/minecraft/world/entity/player/Player
keepall net/minecraft/client/player/AbstractClientPlayer
keepall net/minecraft/client/player/LocalPlayer
noop  net/minecraft/world/entity/Entity#onSyncedDataUpdated
noop  net/minecraft/world/entity/LivingEntity#onSyncedDataUpdated
noop  net/minecraft/world/entity/Avatar#onSyncedDataUpdated
noop  net/minecraft/world/entity/player/Player#onSyncedDataUpdated
noop  net/minecraft/client/player/LocalPlayer#onSyncedDataUpdated
impl  net/minecraft/world/entity/player/Player haste/gui/PlayerImpl
impl  net/minecraft/world/entity/LivingEntity haste/gui/PlayerImpl
impl  net/minecraft/client/player/LocalPlayer haste/gui/PlayerImpl

# tier-1 world: screens reference minecraft.level; the verifier needs the type even when it is null
class net/minecraft/client/multiplayer/ClientLevel
statics net/minecraft/world/level/Level
statics net/minecraft/client/multiplayer/ClientLevel
impl  net/minecraft/world/level/Level haste/gui/LevelImpl
impl  net/minecraft/client/multiplayer/ClientLevel haste/gui/LevelImpl
impl  net/minecraft/world/entity/Entity haste/gui/LevelImpl
