# Tier-2 proxy set (syntax: java/haste/proxy/Gen.java). Generated at startup into cache/proxies/26.3/ (never
# committed). Methods without impl/noop/getter are logging stubs: haste.rt.Unimplemented is the to-do list.
# Every implemented method is listed with its reason in NOTES.md.

class net/minecraft/client/Minecraft
impl  net/minecraft/client/Minecraft haste/gui/ClientImpl

class net/minecraft/client/gui/Gui
impl  net/minecraft/client/gui/Gui haste/gui/ClientImpl

class com/mojang/blaze3d/platform/Window
impl  com/mojang/blaze3d/platform/Window haste/gui/ClientImpl

class net/minecraft/client/gui/Font
impl  net/minecraft/client/gui/Font haste/gui/FontImpl

class net/minecraft/client/gui/GuiGraphicsExtractor
impl  net/minecraft/client/gui/GuiGraphicsExtractor haste/gui/GfxImpl

class net/minecraft/client/Options
impl  net/minecraft/client/Options haste/gui/OptionsImpl

class net/minecraft/client/KeyMapping
impl  net/minecraft/client/KeyMapping haste/gui/KeyImpl

# no sound in Haste yet: every method returns 0/null
class net/minecraft/client/sounds/SoundManager
noop  net/minecraft/client/sounds/SoundManager#*

class net/minecraft/client/player/LocalPlayer
impl  net/minecraft/world/entity/player/Player haste/gui/PlayerImpl
impl  net/minecraft/client/player/LocalPlayer haste/gui/PlayerImpl

class net/minecraft/world/entity/player/Inventory
impl  net/minecraft/world/entity/player/Inventory haste/gui/PlayerImpl

class net/minecraft/world/item/ItemStack
impl  net/minecraft/world/item/ItemStack haste/gui/StackImpl

# tier-1 world: screens reference minecraft.level; the verifier needs the type even when it is null
class net/minecraft/client/multiplayer/ClientLevel

# client services Haste does not have (yet): every method a no-op
class net/minecraft/client/gui/screens/social/PlayerSocialManager
noop  net/minecraft/client/gui/screens/social/PlayerSocialManager#*

# the server connection: tier 1 (Rust owns the connection, WS1)
class net/minecraft/client/multiplayer/ClientPacketListener
impl  net/minecraft/client/multiplayer/ClientPacketListener haste/gui/ConnectionImpl
impl  net/minecraft/client/multiplayer/ClientCommonPacketListenerImpl haste/gui/ConnectionImpl
class net/minecraft/client/GameNarrator
noop  net/minecraft/client/GameNarrator#*

# render pipelines are GPU state: GuiGraphicsExtractor ignores the pipeline argument, so the static fields
# stay null (no <clinit>)
class net/minecraft/client/renderer/RenderPipelines

# the HUD is drawn by Rust; screens only reach into it (chat, saving indicator)
class net/minecraft/client/gui/Hud
impl  net/minecraft/client/gui/Hud haste/gui/ClientImpl
noop  net/minecraft/client/gui/Hud#*

class net/minecraft/client/OptionInstance
impl  net/minecraft/client/OptionInstance haste/gui/OptionsImpl
class net/minecraft/client/multiplayer/chat/report/ReportingContext
noop  net/minecraft/client/multiplayer/chat/report/ReportingContext#*

# native cursors belong to Rust's window; CursorTypes stays real, CursorType objects are named proxies
class com/mojang/blaze3d/platform/cursor/CursorType
impl  com/mojang/blaze3d/platform/cursor/CursorType haste/gui/CursorImpl

# no sound: SoundEvents' holders stay null (their <clinit> registers into BuiltInRegistries), sound instances
# are never built
class net/minecraft/sounds/SoundEvents
class net/minecraft/client/resources/sounds/SimpleSoundInstance
noop  net/minecraft/client/resources/sounds/SimpleSoundInstance#*

# the window's mouse belongs to Rust: position comes from GuiPipeline input, grab/release are recorded
class net/minecraft/client/MouseHandler
impl  net/minecraft/client/MouseHandler haste/gui/MouseImpl
noop  net/minecraft/client/MouseHandler#*

# chat log state is Rust's; the proxy keeps the typed-history deque and draws the Rust lines
class net/minecraft/client/gui/components/ChatComponent
impl  net/minecraft/client/gui/components/ChatComponent haste/gui/ChatImpl
noop  net/minecraft/client/gui/components/ChatComponent#*

# SDL text input / IME belongs to Rust's window: focus and the candidate area are recorded
class com/mojang/blaze3d/platform/TextInputManager
impl  com/mojang/blaze3d/platform/TextInputManager haste/gui/ClientImpl
