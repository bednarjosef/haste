name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the runs it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Cargo.toml builds dependencies at opt-level 3 for a fast dev loop; in CI that triples compile
  # time for no benefit, so dependencies are built unoptimised here.
  CARGO_DEP_OPT: --config profile.dev.package."*".opt-level=0 --config profile.test.package."*".opt-level=0

jobs:
  guard:
    # Seconds: no personal data in files or commit identities (full history).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No personal data (paths, emails, commit identities)
        run: scripts/check-no-personal.sh

  lint:
    # fmt + clippy on all targets, pinned stable toolchain.
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets $CARGO_DEP_OPT -- -D warnings

  test:
    # Fast tier: cargo test on the pinned stable toolchain, in parallel with lint.
    # No cache/ (oracle data is gitignored and several GiB; tier-2/3 tests live on dev
    # machines, see docs/TESTING.md; testkit tests skip their cache-dependent assertions
    # when the dumps are absent).
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Test
        run: cargo test --workspace $CARGO_DEP_OPT

  # Placeholder for the cache-dependent tier (oracle replays, screenshot diffs):
  # needs cache/oracle/26.3 in CI storage first. Tracked in oracles.
  oracle-tier:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Oracle-dependent tests
        run: cargo test -p haste-testkit
